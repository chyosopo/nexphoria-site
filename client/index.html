<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      App-root detection + SPA fallback restore (rafgraph/spa-github-pages).
      MUST be the first element after charset: the <base> it writes anchors
      every relative URL below (favicons, ./assets modules, img/… photography)
      to the app root — /<repo>/ on github.io project pages, / on a custom
      domain. Keep the host test in sync with client/public/404.html.
      The base tag is also what makes the history.replaceState safe: without
      it, the parser resolved ./assets against the restored deep path and
      every module 404'd — blank page on any hard-loaded deep link.
    -->
    <script type="text/javascript">
      (function (l) {
        var keep = /\.github\.io$/.test(l.hostname) ? 1 : 0;
        var root = l.pathname.split('/').slice(0, 1 + keep).join('/') + '/';
        document.write('<base href="' + root + '">');
        window.__NX_APP_BASE__ = root === '/' ? '' : root.slice(0, -1);
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            root.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16.png" />
    <link rel="icon" href="favicon/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/favicon-180.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />

    <!-- Identity graph (Organization + WebSite + MedicalBusiness) is emitted by
         the SEO builders (client/src/lib/seo.ts) on the site entry pages —
         FrontDoor, /men, /women — exactly once each, honesty-gated. The static
         MedicalOrganization/WebSite blocks that once lived here were removed:
         they duplicated the builder WebSite/Organization on the entry-page
         head and could drift from the data-driven builders. Single source of
         truth = the builders. -->

    <!-- Fonts: General Sans, self-hosted (client/public/fonts; faces declared
         in client/src/styles/fonts.css). The 500 (display) and 600 (buttons,
         labels) weights are preloaded so the first paint swaps at once; 400
         (body) follows from the stylesheet. Fontshare and Google Fonts links
         removed 2026-09-05: no font request leaves the origin. Fraunces was
         linked but no rule set it (both --nx-font tokens are General Sans).
         Relative hrefs: the <base> written above anchors them to the app root. -->
    <link rel="preload" as="font" type="font/woff2" href="fonts/general-sans-500.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="fonts/general-sans-600.woff2" crossorigin />
