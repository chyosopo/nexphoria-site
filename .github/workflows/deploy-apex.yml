# Apex deploy — nexphoria.com (Cloudflare Pages project `nexphoria`).
#
# MANUAL TRIGGER ONLY (workflow_dispatch): apex publishes are public and
# require Chiya's explicit go-ahead each time (CLAUDE.md hard rule 2).
# This workflow exists so the deploy can run from CI instead of only from
# the Mac's wrangler OAuth login.
#
# Requires repo secrets:
#   CLOUDFLARE_API_TOKEN   — API token with Cloudflare Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID  — (only needed if the token sees >1 account)
#
# ⚠️ The 404.html is REMOVED before deploy: a top-level 404.html disables
# Cloudflare Pages' automatic SPA fallback (and beats _redirects), turning
# every deep link into a hard 404. The 404.html is gh-pages-only.
name: Deploy Apex (Cloudflare Pages)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: >-
          Cloudflare Pages branch to publish as. Must equal the PROJECT'S
          PRODUCTION BRANCH or the deploy lands as a preview: it uploads, it
          publishes, wrangler prints "Deployment complete", and the apex keeps
          serving the old build. main and production were both tried and both
          aliased (runs 5-7). The real value, read off `wrangler pages
          deployment list`, is claude/cloudflare-agent-setup-x9vzvc — a branch
          name left behind by an earlier agent session that somebody set as the
          project's production branch. It is the default here because it is the
          truth, not because it is a good name. Renaming it in the Cloudflare
          dashboard is worth doing; change this default in the same commit.
        required: false
        default: claude/cloudflare-agent-setup-x9vzvc

concurrency:
  group: deploy-apex
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Deploys THE REF IT WAS DISPATCHED ON, not a hardcoded branch.
      #
      # This used to pin `ref: design/azure`, which meant dispatching the
      # workflow against any other branch silently published design/azure
      # instead — the run would go green while shipping a tree nobody asked
      # for. That is the worst class of deploy bug: it succeeds.
      #
      # workflow_dispatch runs the workflow file from the ref you dispatch on,
      # so the version of this file and the code it ships now always agree.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: "Gate — typecheck"
        run: npm run check

      # The apex is the domain LegitScript reviews. Publishing placeholder
      # business facts there fails the application harder than a blank would,
      # and the failure is silent because the pages look finished. This gate
      # stops the publish instead. Fix by supplying real values in
      # client/src/data/compliance.ts — never by loosening the check.
      - name: "Gate — compliance facts"
        run: npm run audit:compliance

      - name: "Gate — build"
        run: npm run build

      # Reads the built artifact, so it runs after the build. Fails only on
      # site-side regressions; vendor-blocked items are reported, not fatal.
      - name: "Gate — LegitScript readiness"
        run: npm run audit:legitscript

      # Catches the failure mode a catalog change actually causes: not a crash,
      # but correct-looking code rendering the wrong thing. Reads dist/, so it
      # runs after the build.
      - name: "Gate — catalog assumptions"
        run: npm run audit:catalog

      # A2P 10DLC campaign review reads the public site. This asserts the
      # required disclosures against the PRERENDERED HTML per route, so a
      # clause that is bundled but never rendered still fails. Chiya-blocked
      # business facts are reported, not fatal.
      - name: "Gate — A2P 10DLC / SMS compliance"
        run: npm run audit:a2p

      # House voice — CLAUDE.md law 3, defensive negation. Reads the
      # prerendered HTML per route, so it runs after the build.
      - name: "Gate — house voice"
        run: npm run audit:voice

      - name: "Gate — route smoke"
        run: npm run smoke

      - name: "Gate — data drift"
        run: npm run audit:data

      - name: "Gate — design tokens + accent contrast"
        run: npm run audit:design

      - name: "Gate — bundle budget"
        run: npm run audit:bundle

      # audit:funnel is deliberately NOT here. It drives a real Chromium and
      # resolves it from PLAYWRIGHT_CHROMIUM or /opt/pw-browsers/chromium —
      # neither exists on a GitHub runner, so it would fail for environment
      # reasons rather than site reasons and block a good deploy. It runs in
      # the sandbox and on the Mac, where that binary is present.

      - name: Prepare apex artifact (no 404.html on the apex)
        run: rm -f dist/public/404.html

      # Ask Cloudflare what this project's production branch actually is,
      # instead of guessing. A deploy whose --branch does not match it lands as
      # a PREVIEW: it uploads, it publishes, wrangler prints "Deployment
      # complete", and the apex keeps serving the old build. main and
      # production have both been tried and both aliased, so the value is read
      # from the source of truth here and printed into the log. Non-fatal: a
      # diagnostic must never be the thing that blocks a release.
      - name: Report the Pages project config (production branch)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "───── wrangler pages project list ─────"
          npx wrangler pages project list || true
          echo
          echo "───── recent deployments (environment + branch) ─────"
          npx wrangler pages deployment list --project-name=nexphoria || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ inputs.branch || 'claude/cloudflare-agent-setup-x9vzvc' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Create a Cloudflare API token with 'Cloudflare Pages: Edit' and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # A Pages-scoped token cannot enumerate accounts, so wrangler has no
          # account to address unless we hand it one. Without this check the
          # failure is a Cloudflare 7003 forty seconds later, whose message
          # ("perhaps your object identifier is invalid?") points at the
          # PROJECT NAME rather than the missing ID — the giveaway is a double
          # slash in the URL it prints, /accounts//pages/projects/nexphoria,
          # which is easy to read straight past. Fail here and say the real
          # thing instead. Observed on run 3, 2026-08-17.
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set. A Pages-scoped token cannot look up the account by itself. Find the Account ID in the Cloudflare dashboard (right-hand column of the account overview, or the hex string in the dashboard URL) and add it under Settings → Secrets and variables → Actions. It is an identifier, not a credential."
            exit 1
          fi
          npx wrangler pages deploy dist/public --project-name=nexphoria --branch="${BRANCH}" --commit-dirty=true

      - name: Verify apex serves the new build (deep links must 200)
        run: |
          sleep 20
          fail=0
          # Every path below is PRERENDERED, which is what makes this a real
          # check. The routes it used to probe (/pricing, /stacks/ascend,
          # /women) are all retired now and answer 200 from the SPA fallback
          # whether or not the deploy is sound — so the check would have
          # passed on a broken publish. A prerendered deep link is the one
          # thing the 404.html trap actually breaks.
          for p in / /pricing /bloodwork /peptides /peptides/tesamorelin /legal/messaging /faq; do
            # -L is load-bearing: Pages answers a prerendered directory route
            # with a 308 to its trailing-slash form, so without following
            # redirects a perfectly good deploy reports 308 and fails. Measured
            # on the run-5 deployment: /plan -> 308 -> 200.
            code=$(curl -sL -o /dev/null -w "%{http_code}" "https://nexphoria.com$p")
            echo "https://nexphoria.com$p -> $code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
